# Static site: no build step, serve the repo root.
[build]
  publish = "."
  command = ""

# Images and vendor scripts rarely change; let browsers cache them for a week.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
